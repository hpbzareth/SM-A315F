name: Build Samsung Galaxy A31 / A41 (ZarethKernel Rev4 - KSUN v1.1.1 & SuSFS)

'on':
  workflow_dispatch:
    inputs:
      target_device:
        description: 'Target Device to Build'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'a31'
          - 'a41'
      su_variant:
        description: 'Root & SuSFS Variant'
        required: true
        type: choice
        default: 'ksun_susfs'
        options:
          - 'ksun_susfs'
          - 'ksun_nosusfs'
          - 'vanilla'
      make_release:
        description: 'Create/Update GitHub Release on Success'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Release Tag'
        required: false
        type: string
        default: 'v1.0.0-Rev4'

permissions:
  contents: write

jobs:
  matrix_prep:
    name: Setup Matrix
    runs-on: ubuntu-latest
    outputs:
      devices: ${{ steps.set-matrix.outputs.devices }}
    steps:
      - id: set-matrix
        run: |
          if [ "${{ inputs.target_device }}" = "all" ]; then
            echo 'devices=["a31", "a41"]' >> $GITHUB_OUTPUT
          else
            echo 'devices=["${{ inputs.target_device }}"]' >> $GITHUB_OUTPUT
          fi

  build:
    name: Build Samsung ${{ matrix.device }} (${{ inputs.su_variant }})
    needs: matrix_prep
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJson(needs.matrix_prep.outputs.devices) }}

    env:
      KSU_VERSION_OVERRIDE: 33355
      KSU_VERSION_TAG_OVERRIDE: v3.4.2
    steps:
      - name: Free Runner Disk Space
        run: |
          echo "=== Freeing disk space ==="
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -a -f || true
          df -h

      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev lz4 cpio kmod git curl \
            zip unzip file python3 tar wget jq rsync xz-utils perl ccache \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi libncurses5-dev xxd

      - name: Setup Swap Memory
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Download Proton Clang 13
        run: |
          echo "=== Cloning Proton Clang 13 ==="
          mkdir -p $HOME/toolchains
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $HOME/toolchains/proton-clang
          echo "$HOME/toolchains/proton-clang/bin" >> $GITHUB_PATH
          $HOME/toolchains/proton-clang/bin/clang --version
          $HOME/toolchains/proton-clang/bin/aarch64-linux-gnu-as --version

      - name: Setup SuSFS & KernelSU-Next
        run: |
          DEVICE="${{ matrix.device }}"
          VARIANT="${{ inputs.su_variant }}"
          echo "=== Setting up Root Variant: $VARIANT for $DEVICE ==="

          if [ "$VARIANT" = "ksun_susfs" ]; then
            echo "--- Integrating SuSFS 4.14 patches ---"
            git clone --depth=1 -b kernel-4.14 https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
            cp -vf /tmp/susfs4ksu/kernel_patches/fs/* fs/
            cp -vf /tmp/susfs4ksu/kernel_patches/include/linux/* include/linux/
            sed -i 's/#define SUSFS_VERSION .*/#define SUSFS_VERSION "v2.2.0"/' include/linux/susfs.h
            patch -p1 --fuzz=3 < /tmp/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch || true

            echo "--- Integrating KernelSU-Next (pershoot next-susfs with in-tree SuSFS) ---"
            git clone --depth=1 -b next-susfs https://github.com/pershoot/KernelSU-Next.git /tmp/KernelSU-Next

            # Embed ksud magic binary from official v1.1.1 release
            curl -LSs https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/ksud_magic-aarch64-linux-android.zip -o /tmp/ksud.zip
            unzip -q /tmp/ksud.zip -d /tmp/ksud_extracted
            find /tmp/ksud_extracted -name "ksud" -type f -exec cp -v {} /tmp/ksud \;
            chmod +x /tmp/ksud
            xxd -i /tmp/ksud | sed 's/_tmp_ksud_len/ksud_size/' | sed 's/unsigned char _tmp_ksud/const char ksud/' > /tmp/KernelSU-Next/kernel/embed_ksud.c

            # Copy tree to drivers/kernelsu
            rm -rf drivers/kernelsu
            cp -r /tmp/KernelSU-Next/kernel drivers/kernelsu
            grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

            # Patch pkg_observer.c, core_hook.c, fdinfo.c for Linux 4.14
            python3 scripts/patch_ksu_414.py

          elif [ "$VARIANT" = "ksun_nosusfs" ]; then
            echo "--- Integrating KernelSU-Next (Official v1.1.1 without SuSFS) ---"
            git clone --depth=1 -b v1.1.1 https://github.com/KernelSU-Next/KernelSU-Next.git /tmp/KernelSU-Next

            curl -LSs https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/ksud_magic-aarch64-linux-android.zip -o /tmp/ksud.zip
            unzip -q /tmp/ksud.zip -d /tmp/ksud_extracted
            find /tmp/ksud_extracted -name "ksud" -type f -exec cp -v {} /tmp/ksud \;
            chmod +x /tmp/ksud
            xxd -i /tmp/ksud | sed 's/_tmp_ksud_len/ksud_size/' | sed 's/unsigned char _tmp_ksud/const char ksud/' > /tmp/KernelSU-Next/kernel/embed_ksud.c

            rm -rf drivers/kernelsu
            cp -r /tmp/KernelSU-Next/kernel drivers/kernelsu
            grep -q "kernelsu" drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
            grep -q "drivers/kernelsu/Kconfig" drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
            python3 scripts/patch_ksu_414.py
          else
            echo "--- Vanilla mode selected: skipping root injection ---"
          fi

      - name: Configure Kernel Defconfig
        run: |
          DEVICE="${{ matrix.device }}"
          VARIANT="${{ inputs.su_variant }}"
          DEFCONFIG="${DEVICE}_defconfig"

          echo "Target defconfig: $DEFCONFIG"
          if [ ! -f "arch/arm64/configs/$DEFCONFIG" ]; then
            echo "::error::Defconfig arch/arm64/configs/$DEFCONFIG not found!"
            exit 1
          fi

          make O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- $DEFCONFIG

          # Strip Knox and security tripwires that break custom kernels
          for c in UH RUSTUH_RKP RUSTUH_KDP RKP RKP_KDP RKP_CFP DEFEX SECURITY_DEFEX TIMA INTEGRITY KNOX_KAP SECURITY_SELINUX_ALWAYS_ENFORCE LTO LTO_CLANG CC_STACKPROTECTOR_STRONG; do
            scripts/config --file out/.config -d $c || true
          done
          scripts/config --file out/.config -e LTO_NONE || true
          scripts/config --file out/.config -e CC_STACKPROTECTOR_NONE || true
          scripts/config --file out/.config -e SECURITY_SELINUX_DEVELOP || true

          # Relax strict module RWX for runtime hooking compatibility
          scripts/config --file out/.config -d STRICT_MODULE_RWX || true

          # Configure Official Zareth Kernel Branding
          scripts/config --file out/.config --set-str LOCALVERSION " ZarethKernel" || true
          scripts/config --file out/.config -d LOCALVERSION_AUTO || true

          # Size Optimization: -Os ensures Image.gz-dtb stays compact (~14.5MB) fitting 32MB boot partition
          scripts/config --file out/.config -d CC_OPTIMIZE_FOR_PERFORMANCE || true
          scripts/config --file out/.config -e CC_OPTIMIZE_FOR_SIZE || true
          scripts/config --file out/.config -d DEBUG_INFO || true
          scripts/config --file out/.config -d PAGE_OWNER || true
          scripts/config --file out/.config -d SLUB_DEBUG || true
          scripts/config --file out/.config -e STRIP_ASM_SYMS || true

          # KernelSU-Next Legacy Manual Hook Configuration (Zero KProbes)
          scripts/config --file out/.config -e KSU || true
          scripts/config --file out/.config -e KSU_MANUAL_HOOK || true
          scripts/config --file out/.config -d KSU_KPROBES_HOOK || true
          scripts/config --file out/.config -d KSU_SYSCALL_TABLE_HOOK || true

          # Samsung SDP Data Encryption for OneUI 8 (UN1CA) & Stock
          scripts/config --file out/.config -e SDP || true
          scripts/config --file out/.config -e FSCRYPT_SDP || true
          scripts/config --file out/.config -e FS_ENCRYPTION_INLINE_CRYPT || true

          # SELinux Permissive (Essential for GSI & OneUI 8 Port Stability)
          scripts/config --file out/.config -e ALWAYS_PERMISSIVE || true
          scripts/config --file out/.config -d SECURITY_SELINUX_ALWAYS_ENFORCE || true
          scripts/config --file out/.config -e SECURITY_SELINUX_DEVELOP || true

          # === Mitrinket Safe Performance & Hardware Optimizations ===
          echo "--- Applying Mitrinket Hardware Optimizations (RAM, CPU, Touch, Battery, Deep Sleep) ---"

          # 1. RAM Optimization & Memory Reclaim
          scripts/config --file out/.config -e ZRAM || true
          scripts/config --file out/.config -e ZRAM_WRITEBACK || true
          scripts/config --file out/.config -e ZSMALLOC || true
          scripts/config --file out/.config -d ZSMALLOC_STAT || true
          scripts/config --file out/.config -e CRYPTO_LZ4 || true
          scripts/config --file out/.config -e CRYPTO_ZSTD || true
          scripts/config --file out/.config -e PROCESS_RECLAIM || true
          scripts/config --file out/.config -e VMPRESSURE || true

          # 2. CPU & Touch Responsiveness (SchedTune & Schedutil)
          scripts/config --file out/.config -e SCHED_TUNE || true
          scripts/config --file out/.config -e CPU_FREQ_GOV_SCHEDUTIL || true
          scripts/config --file out/.config -e CPU_FREQ_DEFAULT_GOV_SCHEDUTIL || true

          # 3. Google BBR TCP Congestion Control (Low latency, smoother Wi-Fi / LTE)
          scripts/config --file out/.config -e TCP_CONG_ADVANCED || true
          scripts/config --file out/.config -e TCP_CONG_BBR || true
          scripts/config --file out/.config --set-str DEFAULT_TCP_CONG "bbr" || true

          # 4. Instant Deep Sleep & Battery Life (Pin khỏe)
          scripts/config --file out/.config -e PM_AUTOSLEEP || true
          scripts/config --file out/.config -e PM_WAKELOCKS || true
          scripts/config --file out/.config -e WQ_POWER_EFFICIENT_DEFAULT || true
          scripts/config --file out/.config -e CPU_IDLE || true
          scripts/config --file out/.config -e CPU_IDLE_GOV_MENU || true

          # 5. Storage / SSD / Flash Fast I/O Schedulers
          scripts/config --file out/.config -e MQ_IOSCHED_DEADLINE || true
          scripts/config --file out/.config -e MQ_IOSCHED_KYBER || true
          scripts/config --file out/.config -e IOSCHED_BFQ || true
          scripts/config --file out/.config -e IOSCHED_DEADLINE || true

          if [ "$VARIANT" = "ksun_susfs" ]; then
            # Enable KSU with Manual Hooks (No KProbes on MT6768 4.14)
            scripts/config --file out/.config \
              -e KSU \
              -d KPROBES \
              -e HAVE_KPROBES \
              -d KPROBE_EVENTS \
              -d KSU_KPROBES_HOOK \
              -d KSU_ALLOWLIST_WORKAROUND \
              -e OVERLAY_FS

            # Enable SuSFS
            scripts/config --file out/.config -e KSU_SUSFS \
              -e KSU_SUSFS_SUS_PATH \
              -e KSU_SUSFS_SUS_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
              -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
              -e KSU_SUSFS_SUS_KSTAT \
              -e KSU_SUSFS_TRY_UMOUNT \
              -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
              -e KSU_SUSFS_SPOOF_UNAME \
              -e KSU_SUSFS_ENABLE_LOG \
              -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
              -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
              -e KSU_SUSFS_OPEN_REDIRECT \
              -d KSU_SUSFS_SUS_SU || true

          elif [ "$VARIANT" = "ksun_nosusfs" ]; then
            scripts/config --file out/.config \
              -e KSU \
              -d KPROBES \
              -e HAVE_KPROBES \
              -d KPROBE_EVENTS \
              -d KSU_KPROBES_HOOK \
              -d KSU_ALLOWLIST_WORKAROUND \
              -e OVERLAY_FS
          fi

          # Apply olddefconfig non-interactively
          make O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- olddefconfig

          echo "=== Verified Config Settings ==="
          grep -E "CONFIG_LOCALVERSION|CONFIG_KSU|CONFIG_SUSFS|CONFIG_SDP|CONFIG_FSCRYPT_SDP|CONFIG_ALWAYS_PERMISSIVE|CONFIG_TCP_CONG_BBR|CONFIG_PM_AUTOSLEEP|CONFIG_KPROBE" out/.config || true

      - name: Compile Kernel
        shell: bash
        run: |
          echo "=== Starting Kernel Compilation with Proton Clang ==="
          make -j$(nproc) O=out ARCH=arm64 CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" Image.gz dtbs 2>&1 | tee build.log

          if [ ! -f "out/arch/arm64/boot/Image.gz" ]; then
            echo "::error::Image.gz build failed!"
            exit 1
          fi

      - name: Append Device Tree Blob
        run: |
          echo "=== Preparing Image.gz-dtb ==="
          DTB_PATH="out/arch/arm64/boot/dts/mediatek/mt6768.dtb"
          if [ -f "$DTB_PATH" ] && [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cat out/arch/arm64/boot/Image.gz "$DTB_PATH" > out/arch/arm64/boot/Image.gz-dtb
            echo "Successfully appended mt6768.dtb to Image.gz."
          elif [ -f "out/arch/arm64/boot/Image.gz" ]; then
            cp out/arch/arm64/boot/Image.gz out/arch/arm64/boot/Image.gz-dtb
            echo "Copied Image.gz as Image.gz-dtb."
          fi
          ls -lh out/arch/arm64/boot/

      - name: Package with AnyKernel3
        id: package
        run: |
          DEVICE="${{ matrix.device }}"
          UPPER_DEV=$(echo "$DEVICE" | tr '[:lower:]' '[:upper:]')
          BUILD_DATE=$(date "+%Y%m%d-%H%M")
          mkdir -p $GITHUB_WORKSPACE/staging
          cd $GITHUB_WORKSPACE/staging

          echo "Cloning AnyKernel3 template..."
          git clone --depth=1 https://github.com/Edhic1/AnyKernel3.git -b Samsung_A31 anykernel
          cd anykernel
          rm -rf .git README.md

          # Create Mitrinket ASCII Cat Banner
          cat << 'BANNER_EOF' | sed 's/^          //' > banner
          ⠀⠀⠀⠀⠀⠀⠀_                        
          ⠀⠀⠀⠀⠀⠀⠀\`*-.                    
          ⠀⠀⠀⠀⠀⠀⠀⠀)  _`-.                 
          ⠀⠀⠀⠀⠀⠀⠀.  : `. .                
          ⠀⠀⠀⠀⠀⠀⠀: _   '  \               
          ⠀⠀⠀⠀⠀⠀⠀; *` _.   `*-._          
          ⠀⠀⠀⠀⠀⠀⠀`-.-'          `-.       
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀;       `       `.     
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀:.       .        \    
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀. \  .   :   .-'   .   
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀'  `+.;  ;  '      :   
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀:  '  |    ;       ;-. 
          ⠀⠀⠀⠀⠀⠀⠀⠀⠀; '   : :`-:     _.`* ;
          ⠀⠀⠀⠀⠀⠀.*' /  .*' ; .*`- +'  `*' 
          ⠀⠀⠀⠀⠀⠀`*-*   `*-*  `*-*'

          SM-A315F/G Kernel by Zareth
          BANNER_EOF

          # Fix AnyKernel3 device check and dynamic block detection
          sed -i 's/do.devicecheck=1/do.devicecheck=0/' anykernel.sh
          sed -i 's|BLOCK=/dev/block/by-name/boot;|BLOCK=boot;|' anykernel.sh
          sed -i "s/kernel.string=.*/kernel.string=SM-${UPPER_DEV} ZarethKernel (Permissive) - KSUN v1.1.1 & SuSFS v2.2.0/" anykernel.sh

          # Fix Samsung recovery metadata & partition locking (strip #FLASHAFTERUPDATEV2 and metadata references)
          echo "# Dummy file; update-binary is a shell script." > META-INF/com/google/android/updater-script
          sed -i 's|for mount in /cache /data /metadata /persist; do|for mount in /cache; do|' META-INF/com/google/android/update-binary
          sed -i 's|/metadata||g' META-INF/com/google/android/update-binary

          # Bundle official ksud v1.0.5 binary and auto-update /data/adb/ksud on flash
          if [ -f /tmp/ksud ]; then
            cp -vf /tmp/ksud ./ksud
            echo "" >> anykernel.sh
            echo "echo lzo-rle > /sys/block/zram0/comp_algorithm 2>/dev/null || true" >> anykernel.sh
            echo "# Auto-update /data/adb/ksud with official v1.0.5 and clean up stale RSKU state" >> anykernel.sh
            echo "mount /data 2>/dev/null" >> anykernel.sh
            echo "if [ -d /data/adb ]; then" >> anykernel.sh
            echo "  ui_print \"- Updating /data/adb/ksud to official v1.0.5...\"" >> anykernel.sh
            echo "  cp -f \$home/ksud /data/adb/ksud 2>/dev/null" >> anykernel.sh
            echo "  chmod 755 /data/adb/ksud 2>/dev/null" >> anykernel.sh
            echo "  chown 0:0 /data/adb/ksud 2>/dev/null" >> anykernel.sh
            echo "  chcon u:object_r:ksud_exec:s0 /data/adb/ksud 2>/dev/null || chcon u:object_r:system_file:s0 /data/adb/ksud 2>/dev/null" >> anykernel.sh
            echo "  rm -f /data/adb/ksud.sock /data/adb/ksu/ksud.sock 2>/dev/null" >> anykernel.sh
            echo "  # Reset Zygisk Next crash lock to recover daemon" >> anykernel.sh
            echo "  rm -f /data/adb/zygisksu/.abort_msg /data/adb/zygisksu/hook_status 2>/dev/null" >> anykernel.sh
            echo "  # Disable crashing zygisk_vector to prevent system_server bootloop" >> anykernel.sh
            echo "  if [ -d /data/adb/modules/zygisk_vector ]; then" >> anykernel.sh
            echo "    ui_print \"- Disabling zygisk_vector to prevent system_server crash loop...\"" >> anykernel.sh
            echo "    touch /data/adb/modules/zygisk_vector/disable 2>/dev/null" >> anykernel.sh
            echo "  fi" >> anykernel.sh
            echo "fi" >> anykernel.sh
          fi

          cp -v $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz-dtb .
          cp -v $GITHUB_WORKSPACE/out/arch/arm64/boot/Image.gz .

          ZIP_NAME="SM-${UPPER_DEV}-ZarethKernel-Rev4-Permissive-SuSFS.zip"

          zip -r9 "$GITHUB_WORKSPACE/staging/$ZIP_NAME" * -x *placeholder
          echo "Created flashable zip: $ZIP_NAME"

          cd $GITHUB_WORKSPACE/staging

          # Download official KernelSU-Next Manager APKs for v1.1.1
          curl -LSs https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/KernelSU_Next_v1.1.1_12851-release.apk -o "$GITHUB_WORKSPACE/staging/KernelSU_Next_v1.1.1_12851-release.apk"
          curl -LSs https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v1.1.1/KernelSU_Next_v1.1.1-spoofed_12851-release.apk -o "$GITHUB_WORKSPACE/staging/KernelSU_Next_v1.1.1-spoofed_12851-release.apk" || true
          curl -LSs https://github.com/bmax121/APatch/releases/download/11282/APatch_11282_e8e4651_HEAD-release-signed.apk -o "$GITHUB_WORKSPACE/staging/APatch_11282_release.apk" || true

          # Generate sha256 checksums
          sha256sum *.zip *.apk > sha256sums.txt

          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          ls -lh $GITHUB_WORKSPACE/staging/

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Samsung-${{ matrix.device }}-Kernel-${{ github.run_number }}
          path: |
            staging/*.zip
            staging/*.apk
            staging/sha256sums.txt
            out/arch/arm64/boot/Image*
            out/.config
            build.log
          include-hidden-files: true

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: inputs.make_release == true && success()
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all_artifacts
          merge-multiple: true

      - name: Prepare Release Assets & Notes
        run: |
          mkdir -p release_assets
          find all_artifacts -type f \( -name "*.zip" -o -name "*.apk" -o -name "*.txt" \) -exec cp -v {} release_assets/ \;
          cd release_assets
          ls -lh
          cat << 'END_NOTES' > release_notes.md
          ## 🧪 [BETA] Samsung Galaxy A31 (SM-A315F) & A41 (SM-A415F) - KernelSU-Next v3.4.2 Build

          > [!WARNING]
          > **BETA RELEASE (Experimental):** This is a dedicated test build evaluating the upgraded **KernelSU-Next v3.4.2** (Protocol: `33355`) and official `ksud` v3.4.2 64-bit ELF binary. The latest stable release remains **v1.0.0-Rev3**.

          ### 📱 Kernel & Device Details
          - **Device Support:** Samsung Galaxy A31 (`SM-A315F`) & Samsung Galaxy A41 (`SM-A415F`)
          - **Kernel Name:** `4.14.186 Zareth Kernel Beta (KSUN v3.4.2)`
          - **Chipset:** MediaTek Helio P65 (`MT6768`)
          - **Root Engine:** KernelSU-Next **v3.4.2** (Protocol `33355`) + embedded official `ksud` v3.4.2 ELF
          - **Stealth & Anti-Detection:** SuSFS v2.2.0 (kernel-level inline hooks, mount hiding, try_umount)
          - **SELinux Mode:** Permissive
          - **Hook Mode:** Zero KProbes Manual Inline Hooks (100% stability, no kernel crash loops)

          ### 📦 Included Files
          - `SM-A31-ZarethKernel-Beta-KSUN342-Permissive-SuSFS.zip` - Flashable zip for Galaxy A31
          - `SM-A41-ZarethKernel-Beta-KSUN342-Permissive-SuSFS.zip` - Flashable zip for Galaxy A41
          - `KernelSU_Next_v3.4.2_33355-release.apk` - Official Manager APK
          - `KernelSU_Next_v3.4.2-spoofed_33355-release.apk` - Official Spoofed Manager APK
          - `sha256sums.txt` - SHA256 integrity checksums

          ### 💡 Flashing & Usage Instructions
          1. Flash the flashable zip via TWRP / OrangeFox recovery or Kernel Flasher.
          2. The installer will automatically update `/data/adb/ksud` to v3.4.2 and reset lockfiles.
          3. Reboot to system.
          4. Install or upgrade to `KernelSU_Next_v3.4.2_33355-release.apk`.
          END_NOTES
          sed -i 's/^          //' release_notes.md

      - name: Create / Update GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: 'Samsung Galaxy A31 / A41 Revision 4 (ZarethKernel)'
          prerelease: ${{ contains(inputs.release_tag, 'Beta') }}
          body_path: release_assets/release_notes.md
          files: |
            release_assets/*.zip
            release_assets/*.apk
            release_assets/*.txt
